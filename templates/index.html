<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Japan Labor Market Dashboard (2026)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 40px; 
            background: #191919; /* Notion dark mode background */
            color: #E0E0E0; 
        }
        .container { 
            max-width: 1100px; 
            margin: auto; 
            background: #252525; /* Notion dark card background */
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); 
        }
        h1 { 
            text-align: center; 
            color: #FFFFFF; 
            font-size: 24px;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center; 
            color: #9B9A97; 
            font-size: 13px;
            margin-bottom: 20px;
        }
        .chart-container { 
            position: relative; 
            height: 380px; /* Reduced height */
            width: 100%; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Japan Labor Force Survey (2026)</h1>
        <div class="subtitle">Unemployment Rate (%)</div>

        <div class="chart-container">
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <script>
        let chartInstance = null;

        // Custom plugin to draw values with percentage symbols on top of the bars
        const barLabelsPlugin = {
            id: 'barLabelsPlugin',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    meta.data.forEach((element, index) => {
                        const value = dataset.data[index];
                        if (value !== null && value !== undefined) {
                            ctx.save();
                            ctx.font = 'bold 12px -apple-system, sans-serif';
                            ctx.fillStyle = '#E0E0E0';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText(value.toFixed(1) + '%', element.x, element.y - 6);
                            ctx.restore();
                        }
                    });
                });
            }
        };

        async function loadData() {
            try {
                const response = await fetch('/api/cpi');
                const data = await response.json();
                renderChart(data.japan);
            } catch (error) {
                console.error("Error loading JSON data:", error);
            }
        }

        function renderChart(dataset) {
            const labels = dataset.map(item => item.label);
            const indexValues = dataset.map(item => item.index);

            const minIndex = Math.min(...indexValues.filter(v => v !== null));
            const yAxisMin = Math.floor((minIndex - 0.5) * 10) / 10;

            const ctx = document.getElementById('barChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Unemployment Rate (%)',
                            data: indexValues,
                            backgroundColor: 'rgba(59, 130, 246, 0.75)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 1,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            top: 25,
                            bottom: 10
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { 
                                font: { family: 'inherit', size: 13 },
                                color: '#E0E0E0'
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9B9A97' }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            min: yAxisMin,
                            title: { display: true, text: '[ % ]', color: '#E0E0E0' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: '#9B9A97',
                                callback: function(value) { return value.toFixed(1) + '%'; }
                            }
                        }
                    }
                },
                plugins: [barLabelsPlugin]
            });
        }

        loadData();
    </script>
</body>
</html>
