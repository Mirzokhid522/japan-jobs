<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Japan Labor Market Dashboard (2026)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 40px; 
            background: #191919; 
            color: #E0E0E0; 
        }
        .container { 
            max-width: 1100px; 
            margin: auto; 
        }
        .card {
            background: #252525; 
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); 
            margin-bottom: 30px;
        }
        h1 { 
            text-align: center; 
            color: #FFFFFF; 
            font-size: 26px;
            margin-bottom: 4px;
        }
        .main-subtitle {
            text-align: center; 
            color: #9B9A97; 
            font-size: 14px;
            margin-bottom: 30px;
        }
        h2 { 
            color: #FFFFFF; 
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 4px;
        }
        .chart-subtitle {
            color: #9B9A97; 
            font-size: 13px;
            margin-bottom: 15px;
        }
        .chart-container { 
            position: relative; 
            height: 380px; 
            width: 100%; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Japan Labor Force Survey (2026)</h1>
        <div class="main-subtitle">Comprehensive Monthly Labor Statistics (Both Sexes)</div>

        <!-- Unemployment Rate Chart -->
        <div class="card">
            <h2>Unemployment Rate</h2>
            <div class="chart-subtitle">Percentage of labor force unemployed</div>
            <div class="chart-container">
                <canvas id="unemploymentChart"></canvas>
            </div>
        </div>

        <!-- Participation Rate Chart -->
        <div class="card">
            <h2>Labour Force Participation Rate</h2>
            <div class="chart-subtitle">Percentage of working-age population in the labor force</div>
            <div class="chart-container">
                <canvas id="participationChart"></canvas>
            </div>
        </div>

        <!-- Employment Rate Chart -->
        <div class="card">
            <h2>Employment Rate</h2>
            <div class="chart-subtitle">Percentage of working-age population employed</div>
            <div class="chart-container">
                <canvas id="employmentChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Custom plugin to draw percentage labels above bars
        const barLabelsPlugin = {
            id: 'barLabelsPlugin',
            afterDatasetsDraw(chart) {
                const ctx = chart.ctx;
                chart.data.datasets.forEach((dataset, i) => {
                    const meta = chart.getDatasetMeta(i);
                    meta.data.forEach((element, index) => {
                        const value = dataset.data[index];
                        if (value !== null && value !== undefined) {
                            ctx.save();
                            ctx.font = 'bold 11px -apple-system, sans-serif';
                            ctx.fillStyle = '#E0E0E0';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText(value.toFixed(1) + '%', element.x, element.y - 6);
                            ctx.restore();
                        }
                    });
                });
            }
        };

        async function loadData() {
            try {
                const response = await fetch('/api/cpi');
                const data = await response.json();
                
                renderChart('unemploymentChart', data.unemployment, 'Unemployment Rate (%)', 'rgba(59, 130, 246, 0.75)', 'rgba(59, 130, 246, 1)');
                renderChart('participationChart', data.participation, 'Participation Rate (%)', 'rgba(16, 185, 129, 0.75)', 'rgba(16, 185, 129, 1)');
                renderChart('employmentChart', data.employment, 'Employment Rate (%)', 'rgba(245, 158, 11, 0.75)', 'rgba(245, 158, 11, 1)');
            } catch (error) {
                console.error("Error loading JSON data:", error);
            }
        }

        function renderChart(canvasId, dataset, labelName, bgColor, borderColor) {
            const labels = dataset.map(item => item.label);
            const indexValues = dataset.map(item => item.index);

            const minVal = Math.min(...indexValues.filter(v => v !== null));
            const yAxisMin = Math.floor((minVal - 1.0) * 10) / 10;

            const ctx = document.getElementById(canvasId).getContext('2d');

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: labelName,
                            data: indexValues,
                            backgroundColor: bgColor,
                            borderColor: borderColor,
                            borderWidth: 1,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 25, bottom: 10 }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { font: { family: 'inherit', size: 12 }, color: '#E0E0E0' }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#9B9A97' }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            min: yAxisMin > 0 ? yAxisMin : 0,
                            title: { display: true, text: '[ % ]', color: '#E0E0E0' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: '#9B9A97',
                                callback: function(value) { return value.toFixed(1) + '%'; }
                            }
                        }
                    }
                },
                plugins: [barLabelsPlugin]
            });
        }

        loadData();
    </script>
</body>
</html>
